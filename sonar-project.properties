# Configuracao do SonarCloud para o laboratorio AIOps.
#
# Pre-requisitos (fazer uma vez, fora deste repositorio):
#   1. Criar conta em https://sonarcloud.io e logar com GitHub.
#   2. "+" > "Analyze new project" > selecionar o repositorio cetertick/fiap-aiops.
#   3. Anotar a "Organization Key" (geralmente igual ao seu usuario/org do GitHub,
#      ex.: "cetertick") e a "Project Key" sugerida (ex.: "cetertick_fiap-aiops").
#      Ajuste os valores abaixo e em .github/workflows/ci.yml para bater exatamente
#      com o que o SonarCloud mostrar.
#   4. Em My Account > Security, gerar um token e salvar como secret do repositorio
#      GitHub: Settings > Secrets and variables > Actions > New repository secret
#      com o nome SONAR_TOKEN.

sonar.projectKey=cetertick_fiap-aiops
sonar.organization=cetertick

sonar.projectName=FIAP AIOps Lab
sonar.sources=apps,aiops-agent,postmortem
sonar.exclusions=**/node_modules/**,**/vendor/**,**/*.min.js,**/dist/**,**/__pycache__/**

# Multi-linguagem: Python (orders-api, aiops-agent, postmortem),
# Node.js (payments-api), Go (inventory-api).
sonar.python.version=3.12
