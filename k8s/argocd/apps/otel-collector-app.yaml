apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  labels:
    aiops-lab-component: observability
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.97.0 # bump with: helm search repo opentelemetry-collector --versions
      helm:
        releaseName: otel-collector
        valueFiles:
          - $values/k8s/observability/values/values-otel-collector.yaml
    - repoURL: https://github.com/cetertick/fiap-aiops.git
      targetRevision: claude/confident-carson-hor10c # NOTE: change to main/HEAD once merged
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
