apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  labels:
    aiops-lab-component: observability
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki-stack
      targetRevision: 2.10.2 # bump with: helm search repo loki-stack --versions
      helm:
        releaseName: loki
        valueFiles:
          - $values/k8s/observability/values/values-loki.yaml
    - repoURL: https://github.com/cetertick/fiap-aiops.git
      targetRevision: claude/confident-carson-hor10c # NOTE: change to main/HEAD once merged
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
