# Helm values for:
#   chart:   opentelemetry-collector
#   repo:    https://open-telemetry.github.io/opentelemetry-helm-charts
#   release: otel-collector
#   namespace: monitoring
#   mode:    deployment
#
# Receives OTLP traces from the 3 demo apps on
#   otel-collector.monitoring.svc.cluster.local:4317  (gRPC)
#   otel-collector.monitoring.svc.cluster.local:4318  (HTTP)
# and forwards them to Tempo. A debug/logging exporter is also wired into the
# traces pipeline so `kubectl logs` on the collector pod shows span activity
# live during the class demo.

mode: deployment
fullnameOverride: otel-collector

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: 4318
    protocol: TCP
  # Not used by this lab's pipeline; disable the chart's other default ports
  # to keep the collector's Service tidy.
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  exporters:
    otlp/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
    # Verbose exporter so traces are visible in `kubectl logs deploy/otel-collector -n monitoring`
    # during the live class demo. Called "debug" in recent collector-contrib
    # versions (replaces the deprecated "logging" exporter name).
    debug:
      verbosity: detailed

  service:
    pipelines:
      traces:
        receivers: [otlp]
        exporters: [otlp/tempo, debug]
      # Explicitly no metrics/logs pipelines: app metrics are scraped
      # directly by Prometheus via PodMonitors, and app logs go to stdout
      # for Promtail — the collector in this lab is traces-only.
      metrics: null
      logs: null
