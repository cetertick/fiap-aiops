apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: aiops-lab
  labels:
    app: inventory-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
    spec:
      containers:
        - name: inventory-api
          image: ghcr.io/cetertick/fiap-aiops-inventory-api:latest
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: CHAOS_ENABLED
              value: "false"
            - name: CHAOS_MODE
              value: "none"
            - name: CHAOS_INTENSITY
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
