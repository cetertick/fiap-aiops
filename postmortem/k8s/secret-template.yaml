# TEMPLATE — NÃO contém segredos reais e NÃO deve ser aplicado diretamente
# com valores de exemplo.
#
# Este arquivo documenta o shape esperado do Secret `postmortem-secrets` no
# namespace `aiops-lab`, consumido pelo Deployment `postmortem-service`
# (ver deployment.yaml, bloco `envFrom`).
#
# Prefira criar o Secret via linha de comando (kubectl create secret), que
# nunca grava os valores em um arquivo versionado no git:
#
#   kubectl create secret generic postmortem-secrets \
#     -n aiops-lab \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-xxxxxxxxxxxxxxxxxxxxx \
#     --from-literal=DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/xxxx/yyyy
#
# Veja o README.md deste diretório para o passo a passo completo (como obter
# a API key da Anthropic e a URL do webhook do Discord).
#
# Se preferir aplicar via manifesto (ex.: fora da aula, em um ambiente onde
# vocês controlam o acesso ao arquivo), copie o bloco abaixo para um arquivo
# NÃO versionado (ex.: secret.local.yaml, já no .gitignore) e preencha os
# valores em base64 antes de `kubectl apply -f`:
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: postmortem-secrets
#   namespace: aiops-lab
# type: Opaque
# stringData:
#   ANTHROPIC_API_KEY: "sk-ant-xxxxxxxxxxxxxxxxxxxxx"
#   DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/xxxx/yyyy"
