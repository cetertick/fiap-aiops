apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: aiops-agent
  namespace: aiops-lab
  labels:
    app: aiops-agent
spec:
  selector:
    matchLabels:
      app: aiops-agent
  namespaceSelector:
    matchNames:
      - aiops-lab
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
