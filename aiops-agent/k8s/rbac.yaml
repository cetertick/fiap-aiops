# Namespaced Role (NOT a ClusterRole) -- the agent only ever needs to act
# inside aiops-lab, so its permissions are scoped to that one namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-agent
  namespace: aiops-lab
  labels:
    app: aiops-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-agent
  namespace: aiops-lab
  labels:
    app: aiops-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-agent
subjects:
  - kind: ServiceAccount
    name: aiops-agent
    namespace: aiops-lab
